name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autotrader-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Report success to status branch
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin status || true
          git checkout status || git checkout --orphan status
          cp app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk || true
          echo "{\"time\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"status\": \"success\", \"sha\": \"${GITHUB_SHA}\"}" > build-status.json
          git add -f build-status.json app-debug.apk
          git commit -m "build: success ${GITHUB_SHA:0:7}" || true
          git push origin status

      - name: Report failure to status branch
        if: failure()
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin status || true
          git checkout status || git checkout --orphan status
          echo "{\"time\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"status\": \"failure\", \"sha\": \"${GITHUB_SHA}\"}" > build-status.json
          git add build-status.json
          git commit -m "build: failure" || true
          git push origin status
